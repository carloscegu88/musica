<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Acordes Pro con Metrónomo Visual</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #263238; /* Fondo un poco más oscuro para resaltar las luces */
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- METRÓNOMO VISUAL (LUCES LED) --- */
        #lights-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            height: 40px;
            align-items: center;
            justify-content: center;
        }

        .light {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: #455a64; /* Color apagado */
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.05s ease; /* Transición muy rápida para el parpadeo */
        }

        /* Luz del Acento (Primer tiempo - Naranja/Rojo) */
        .light.active-accent {
            background-color: #ff5722; 
            box-shadow: 0 0 20px #ff5722, inset 0 2px 4px rgba(255,255,255,0.4);
        }

        /* Luces de relleno (Tiempos 2, 3, 4... - Amarillo) */
        .light.active-beat {
            background-color: #ffeb3b; 
            box-shadow: 0 0 20px #ffeb3b, inset 0 2px 4px rgba(255,255,255,0.4);
        }

        /* --- CONTENEDOR DE ACORDES --- */
        #chord-container {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 10px; 
            margin-bottom: 40px;
            min-height: 220px;
            width: 100%;
        }

        .chord {
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #active-chord { font-size: 8rem; color: #2ecc71; height: 140px; }
        #next-chord { font-size: 3.5rem; color: #e74c3c; height: 60px; opacity: 0.8; }

        @keyframes slideUpFixed {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popUp {
            from { transform: scale(0.5) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 0.8; }
        }

        /* --- CONTROLES INFERIORES --- */
        .controls {
            background-color: #37474f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #b0bec5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 1.2rem;
            width: 70px;
            border: none;
            border-radius: 5px;
            text-align: center;
            background-color: #eceff1;
            color: #263238;
            font-weight: bold;
            outline: none;
        }

        /* Diseño del slider de volumen */
        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        #start-btn { background-color: #27ae60; color: white; }
        #start-btn:hover { background-color: #2ecc71; transform: translateY(-2px); }
        
        #stop-btn { background-color: #c0392b; color: white; }
        #stop-btn:hover { background-color: #e74c3c; transform: translateY(-2px); }
    </style>
</head>
<body>

    <!-- Nuevo contenedor para los LEDs -->
    <div id="lights-container">
        <!-- Las luces se insertan aquí vía JavaScript -->
    </div>

    <div id="chord-container">
        <div id="active-chord" class="chord">🎸</div>
        <div id="next-chord" class="chord"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label for="bpm-input">BPM</label>
            <input type="number" id="bpm-input" value="80" min="30" max="300">
        </div>
        
        <div class="input-group">
            <label for="beats-input">Tiempos</label>
            <input type="number" id="beats-input" value="4" min="1" max="16">
        </div>

        <div class="input-group">
            <label for="vol-input">Volumen Acorde</label>
            <input type="range" id="vol-input" min="0" max="1" step="0.05" value="0.7">
        </div>
        
        <div class="button-group">
            <button id="start-btn">Iniciar</button>
            <button id="stop-btn">Detener</button>
        </div>
    </div>

    <script>
        const chords = [
            'C', 'Cm', 'C#', 'C#m', 'D', 'Dm', 'Eb', 'Ebm', 
            'E', 'Em', 'F', 'Fm', 'F#', 'F#m', 'G', 'Gm', 
            'G#', 'G#m', 'A', 'Am', 'Bb', 'Bbm', 'B', 'Bm'
        ];

        let intervalId = null;
        let upcomingChord = ''; 
        let currentActiveChord = ''; 
        let currentBeat = 1;
        let totalBeats = 4;
        
        let audioCtx; 

        // Referencias del DOM
        const lightsContainer = document.getElementById('lights-container');
        const activeDisplay = document.getElementById('active-chord');
        const nextDisplay = document.getElementById('next-chord');
        const inputBpm = document.getElementById('bpm-input');
        const inputBeats = document.getElementById('beats-input');
        const inputVol = document.getElementById('vol-input');
        const btnStart = document.getElementById('start-btn');
        const btnStop = document.getElementById('stop-btn');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // --- DIBUJAR LAS LUCES LED ---
        function setupLights() {
            lightsContainer.innerHTML = ''; // Limpiamos las luces anteriores
            for (let i = 0; i < totalBeats; i++) {
                const light = document.createElement('div');
                light.className = 'light';
                lightsContainer.appendChild(light);
            }
        }

        // --- ACTUALIZAR EL ESTADO DE LAS LUCES ---
        function updateLights() {
            const lights = document.querySelectorAll('.light');
            lights.forEach((light, index) => {
                // Apagamos todas primero
                light.classList.remove('active-accent', 'active-beat');
                
                // Encendemos la que corresponde al pulso actual (currentBeat va de 1 en adelante, index de 0)
                if (index === currentBeat - 1) {
                    if (index === 0) {
                        light.classList.add('active-accent'); // Primera luz (Naranja)
                    } else {
                        light.classList.add('active-beat'); // Demás luces (Amarillo)
                    }
                }
            });
        }

        const midiNotes = {
            'C': 48, 'C#': 49, 'Db': 49, 'D': 50, 'Eb': 51, 'D#': 51, 
            'E': 52, 'F': 53, 'F#': 54, 'Gb': 54, 'G': 55, 'G#': 56, 
            'Ab': 56, 'A': 57, 'Bb': 58, 'A#': 58, 'B': 59
        };

        function getChordFrequencies(chordName) {
            let rootText = '';
            let isMinor = false;
            
            if (chordName.length > 1 && (chordName[1] === '#' || chordName[1] === 'b')) {
                rootText = chordName.substring(0, 2);
                isMinor = chordName.includes('m');
            } else {
                rootText = chordName[0];
                isMinor = chordName.includes('m');
            }
            
            const rootMidi = midiNotes[rootText];
            const intervals = isMinor ? [0, 3, 7] : [0, 4, 7];
            
            return intervals.map(interval => {
                const midi = rootMidi + interval;
                return 440 * Math.pow(2, (midi - 69) / 12);
            });
        }

        function playSound(isFirstBeat, chordName) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            // Obtenemos el nivel de volumen del slider (de 0.0 a 1.0)
            const globalVolume = parseFloat(inputVol.value);

            if (isFirstBeat && chordName) {
                const frequencies = getChordFrequencies(chordName);
                
                frequencies.forEach(freq => {
                    const osc = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    
                    osc.type = 'triangle'; 
                    osc.frequency.value = freq;
                    
                    // Dividimos el volumen entre 3 para que al sumar las 3 notas del acorde no se distorsione (clipping)
                    const oscVolume = globalVolume / 3; 

                    gainNode.gain.setValueAtTime(0, t);
                    gainNode.gain.linearRampToValueAtTime(oscVolume, t + 0.05); 
                    gainNode.gain.exponentialRampToValueAtTime(0.001, t + 1.5); 
                    
                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                    
                    osc.start(t);
                    osc.stop(t + 1.5);
                });
            } else {
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.value = 700; 
                
                // El clic de relleno siempre suena bajito para no opacar tu guitarra
                gainNode.gain.setValueAtTime(0.2, t);
                gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.1); 
                
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.start(t);
                osc.stop(t + 0.1);
            }
        }

        function getRandomChord() {
            return chords[Math.floor(Math.random() * chords.length)];
        }

        function shiftChords() {
            currentActiveChord = upcomingChord === '' ? getRandomChord() : upcomingChord;
            upcomingChord = getRandomChord();

            activeDisplay.style.animation = 'none';
            nextDisplay.style.animation = 'none';
            
            void activeDisplay.offsetWidth; 

            activeDisplay.innerText = currentActiveChord;
            nextDisplay.innerText = upcomingChord;

            activeDisplay.style.animation = 'slideUpFixed 0.25s ease-out';
            nextDisplay.style.animation = 'popUp 0.3s ease-out';
        }

        function tick() {
            if (currentBeat === 1) shiftChords();
            
            updateLights(); // Cambiamos las luces LED
            playSound(currentBeat === 1, currentActiveChord);

            currentBeat++;
            if (currentBeat > totalBeats) currentBeat = 1;
        }

        btnStart.addEventListener('click', () => {
            initAudio(); 

            if (intervalId) clearInterval(intervalId);

            const bpm = parseInt(inputBpm.value);
            totalBeats = parseInt(inputBeats.value);

            if (isNaN(bpm) || bpm < 30) return alert('Por favor, ingresa un BPM válido.');
            if (isNaN(totalBeats) || totalBeats < 1) return alert('Por favor, ingresa al menos 1 tiempo por acorde.');

            // Preparamos las luces antes de empezar
            setupLights();

            const intervalInMs = 60000 / bpm;
            upcomingChord = ''; 
            currentBeat = 1; 

            tick(); 
            intervalId = setInterval(tick, intervalInMs);
        });

        btnStop.addEventListener('click', () => {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
                activeDisplay.innerText = '⏸️';
                nextDisplay.innerText = '';
                
                // Apagamos todas las luces
                document.querySelectorAll('.light').forEach(l => l.classList.remove('active-accent', 'active-beat'));
            }
        });
    </script>
</body>
</html>
