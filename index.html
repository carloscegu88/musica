<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Acordes Pro con Sonido de Guitarra Real</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #263238;
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #lights-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            height: 40px;
            align-items: center;
            justify-content: center;
        }

        .light {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background-color: #455a64;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
            transition: all 0.05s ease;
        }

        .light.active-accent {
            background-color: #ff5722; 
            box-shadow: 0 0 20px #ff5722, inset 0 2px 4px rgba(255,255,255,0.4);
        }

        .light.active-beat {
            background-color: #ffeb3b; 
            box-shadow: 0 0 20px #ffeb3b, inset 0 2px 4px rgba(255,255,255,0.4);
        }

        #chord-container {
            display: flex;
            flex-direction: column; 
            align-items: center;
            justify-content: center;
            gap: 10px; 
            margin-bottom: 40px;
            min-height: 220px;
            width: 100%;
        }

        .chord {
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #active-chord { font-size: 8rem; color: #2ecc71; height: 140px; }
        #next-chord { font-size: 3.5rem; color: #e74c3c; height: 60px; opacity: 0.8; }

        @keyframes slideUpFixed {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes popUp {
            from { transform: scale(0.5) translateY(20px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 0.8; }
        }

        .controls {
            background-color: #37474f;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 650px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: #b0bec5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 1.2rem;
            width: 70px;
            border: none;
            border-radius: 5px;
            text-align: center;
            background-color: #eceff1;
            color: #263238;
            font-weight: bold;
            outline: none;
        }

        input[type="range"] {
            width: 100px;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        button {
            padding: 12px 24px;
            font-size: 1.1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        #start-btn { background-color: #27ae60; color: white; }
        #start-btn:hover { background-color: #2ecc71; transform: translateY(-2px); }
        
        #stop-btn { background-color: #c0392b; color: white; }
        #stop-btn:hover { background-color: #e74c3c; transform: translateY(-2px); }
        
        #loading-status {
            font-size: 0.9rem;
            color: #f39c12;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="lights-container"></div>

    <div id="chord-container">
        <div id="active-chord" class="chord">🎸</div>
        <div id="next-chord" class="chord"></div>
    </div>

    <div class="controls">
        <div class="input-group">
            <label for="bpm-input">BPM</label>
            <input type="number" id="bpm-input" value="80" min="30" max="300">
        </div>
        
        <div class="input-group">
            <label for="beats-input">Tiempos</label>
            <input type="number" id="beats-input" value="4" min="1" max="16">
        </div>

        <div class="input-group">
            <label for="vol-input">Volumen Guitarra</label>
            <input type="range" id="vol-input" min="0" max="1" step="0.05" value="0.8">
        </div>
        
        <div class="button-group">
            <button id="start-btn">Iniciar</button>
            <button id="stop-btn">Detener</button>
        </div>
    </div>
    
    <div id="loading-status">Cargando muestras de guitarra real...</div>

    <script>
        const chords = [
            'C', 'Cm', 'C#', 'C#m', 'D', 'Dm', 'Eb', 'Ebm', 
            'E', 'Em', 'F', 'Fm', 'F#', 'F#m', 'G', 'Gm', 
            'G#', 'G#m', 'A', 'Am', 'Bb', 'Bbm', 'B', 'Bm'
        ];

        let intervalId = null;
        let upcomingChord = ''; 
        let currentActiveChord = ''; 
        let currentBeat = 1;
        let totalBeats = 4;
        
        let audioCtx;
        let guitarBuffers = {};
        let isLoaded = false;

        // URLs públicas de notas de guitarra limpia (Archivos de muestra de alta fidelidad)
        // Usamos notas base para construir cualquier acorde mayor o menor mediante transporte de tono
        const sampleUrls = {
            'C': 'https://tonejs.github.io/audio/salamander/C4.mp3',
            'D': 'https://tonejs.github.io/audio/salamander/D4.mp3',
            'E': 'https://tonejs.github.io/audio/salamander/E4.mp3',
            'F': 'https://tonejs.github.io/audio/salamander/F4.mp3',
            'G': 'https://tonejs.github.io/audio/salamander/G4.mp3',
            'A': 'https://tonejs.github.io/audio/salamander/A4.mp3',
            'B': 'https://tonejs.github.io/audio/salamander/B4.mp3'
        };

        const statusDiv = document.getElementById('loading-status');
        const btnStart = document.getElementById('start-btn');

        // Deshabilitar botón de inicio hasta que carguen los audios
        btnStart.disabled = true;
        btnStart.style.opacity = '0.5';

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Cargar las muestras de guitarra de manera asíncrona al abrir la página
        async function loadSamples() {
            initAudio();
            for (let note in sampleUrls) {
                try {
                    const response = await fetch(sampleUrls[note]);
                    const arrayBuffer = await response.arrayBuffer();
                    guitarBuffers[note] = await audioCtx.decodeAudioData(arrayBuffer);
                } catch (e) {
                    console.error("Error cargando muestra: " + note, e);
                }
            }
            isLoaded = true;
            statusDiv.innerText = "¡Guitarra lista para tocar!";
            statusDiv.style.color = "#2ecc71";
            btnStart.disabled = false;
            btnStart.style.opacity = '1';
        }

        window.addEventListener('click', () => {
            if (!audioCtx) loadSamples();
        }, { once: true });

        // Mapeo de notas raíz y sus intervalos relativos en semitonos para formar acordes
        const noteMap = {
            'C': { base: 'C', semitones: 0 },
            'C#': { base: 'C', semitones: 1 },
            'Db': { base: 'C', semitones: 1 },
            'D': { base: 'D', semitones: 0 },
            'D#': { base: 'D', semitones: 1 },
            'Eb': { base: 'D', semitones: 1 },
            'E': { base: 'E', semitones: 0 },
            'F': { base: 'F', semitones: 0 },
            'F#': { base: 'F', semitones: 1 },
            'Gb': { base: 'F', semitones: 1 },
            'G': { base: 'G', semitones: 0 },
            'G#': { base: 'G', semitones: 1 },
            'Ab': { base: 'G', semitones: 1 },
            'A': { base: 'A', semitones: 0 },
            'A#': { base: 'A', semitones: 1 },
            'Bb': { base: 'A', semitones: 1 },
            'B': { base: 'B', semitones: 0 }
        };

        function playRealGuitarChord(chordName) {
            if (!isLoaded || !audioCtx) return;

            let rootText = '';
            let isMinor = false;
            
            if (chordName.length > 1 && (chordName[1] === '#' || chordName[1] === 'b')) {
                rootText = chordName.substring(0, 2);
                isMinor = chordName.includes('m');
            } else {
                rootText = chordName[0];
                isMinor = chordName.includes('m');
            }

            const chordInfo = noteMap[rootText];
            if (!chordInfo) return;

            // Intervalos del acorde (Tónica, Tercera Mayor/Menor, Quinta) en semitonos
            const intervals = isMinor ? [0, 3, 7] : [0, 4, 7];
            const globalVolume = parseFloat(document.getElementById('vol-input').value);

            // Reproducimos cada nota del acorde con un pequeño retraso estilo rasgueo de guitarra
            intervals.forEach((interval, index) => {
                setTimeout(() => {
                    const source = audioCtx.createBufferSource();
                    const gainNode = audioCtx.createGain();

                    // Seleccionamos la muestra base más cercana y aplicamos cambio de tono (playbackRate)
                    // 1 semitono = Math.pow(2, 1/12)
                    const totalSemitones = chordInfo.semitones + interval;
                    
                    // Usamos la muestra base de 'A' o 'C' según corresponda
                    source.buffer = guitarBuffers[chordInfo.base];
                    if(!source.buffer) return;

                    source.playbackRate.value = Math.pow(2, totalSemitones / 12);

                    gainNode.gain.setValueAtTime(globalVolume / 2.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.0);

                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    source.start();
                }, index * 25); // Rasgueo de 25ms entre cuerda y cuerda
            });
        }

        function playMetronomeClick() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.value = 700; 
            
            gainNode.gain.setValueAtTime(0.2, t);
            gainNode.gain.exponentialRampToValueAtTime(0.001, t + 0.08); 
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start(t);
            osc.stop(t + 0.08);
        }

        const lightsContainer = document.getElementById('lights-container');
        const activeDisplay = document.getElementById('active-chord');
        const nextDisplay = document.getElementById('next-chord');
        const inputBpm = document.getElementById('bpm-input');
        const inputBeats = document.getElementById('beats-input');

        function setupLights() {
            lightsContainer.innerHTML = '';
            for (let i = 0; i < totalBeats; i++) {
                const light = document.createElement('div');
                light.className = 'light';
                lightsContainer.appendChild(light);
            }
        }

        function updateLights() {
            const lights = document.querySelectorAll('.light');
            lights.forEach((light, index) => {
                light.classList.remove('active-accent', 'active-beat');
                if (index === currentBeat - 1) {
                    if (index === 0) light.classList.add('active-accent');
                    else light.classList.add('active-beat');
                }
            });
        }

        function getRandomChord() {
            return chords[Math.floor(Math.random() * chords.length)];
        }

        function shiftChords() {
            currentActiveChord = upcomingChord === '' ? getRandomChord() : upcomingChord;
            upcomingChord = getRandomChord();

            activeDisplay.style.animation = 'none';
            nextDisplay.style.animation = 'none';
            void activeDisplay.offsetWidth; 

            activeDisplay.innerText = currentActiveChord;
            nextDisplay.innerText = upcomingChord;

            activeDisplay.style.animation = 'slideUpFixed 0.25s ease-out';
            nextDisplay.style.animation = 'popUp 0.3s ease-out';
        }

        function tick() {
            if (currentBeat === 1) {
                shiftChords();
                playRealGuitarChord(currentActiveChord); // Toca el acorde real de guitarra
            } else {
                playMetronomeClick(); // Toca el clic normal
            }
            updateLights();

            currentBeat++;
            if (currentBeat > totalBeats) currentBeat = 1;
        }

        btnStart.addEventListener('click', () => {
            initAudio(); 
            if (intervalId) clearInterval(intervalId);

            const bpm = parseInt(inputBpm.value);
            totalBeats = parseInt(inputBeats.value);

            if (isNaN(bpm) || bpm < 30) return alert('Por favor, ingresa un BPM válido.');
            if (isNaN(totalBeats) || totalBeats < 1) return alert('Por favor, ingresa al menos 1 tiempo.');

            setupLights();
            const intervalInMs = 60000 / bpm;
            upcomingChord = ''; 
            currentBeat = 1; 

            tick(); 
            intervalId = setInterval(tick, intervalInMs);
        });

        document.getElementById('stop-btn').addEventListener('click', () => {
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
                activeDisplay.innerText = '⏸️';
                nextDisplay.innerText = '';
                document.querySelectorAll('.light').forEach(l => l.classList.remove('active-accent', 'active-beat'));
            }
        });
    </script>
</body>
</html>
